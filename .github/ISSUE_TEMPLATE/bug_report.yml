name: 问题反馈
description: 报告安装、识别或调度中可以复现的问题。
title: '[Bug] '
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: 助手版本
      placeholder: 例如 0.8.3，程序版或源码版
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: Windows/MuMu 版本、游戏渠道和分辨率；不要填写角色名或主城坐标。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤、实际结果与预期结果
      description: 说明正在执行的任务和可重复的触发条件。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏后的错误文本或最小截图
      description: 不要直接上传整个诊断包、data、账号配置或数据库。
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开内容检查
      options:
        - label: 我已移除昵称、主城坐标、聊天、本机用户名、设备标识和凭据。
          required: true
