name: CI

on:
  push:
    branches: [main]
    paths: ['sanmou_assistant/**', 'scripts/**', 'tests/**', 'requirements*.txt', 'pyproject.toml', '.github/workflows/ci.yml']
  pull_request:
    paths: ['sanmou_assistant/**', 'scripts/**', 'tests/**', 'requirements*.txt', 'pyproject.toml', '.github/workflows/ci.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit source and history
        run: python scripts/audit_publication.py --repository . --history
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          python -m pip install --no-deps -e .
          if ($LASTEXITCODE -ne 0) { throw 'Source package metadata or installation failed' }
      - name: Run independent tests
        run: python -m pytest -q
